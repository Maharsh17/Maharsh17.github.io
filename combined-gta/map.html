<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Maharsh Jani - Map</title>
	<link rel="icon" type="image/png" sizes="32x32" href="./assets/menu/images/favicon-32x32.png">
	<meta name="description" content="Interactive map in GTA San Andreas style, centred on you or on Champaign-Urbana">
	<link rel="stylesheet" href="./assets/menu/fonts/myfonts.min.css">
	<link rel="stylesheet" href="./assets/menu/css/normalize.min.css">
	<link rel="stylesheet" href="./assets/menu/css/gtasamenu.min.css">
	<link rel="stylesheet" href="./assets/notify/css/gtasa-notification.min.css">
	<link rel="stylesheet" href="./assets/maplibre/maplibre-gl.css">
	<link rel="stylesheet" href="./css/site.css">
</head>
<body data-section="map" class="container container--map">
	<header class="menu-header"></header>
	<main class="menu-content site-map">
		<div class="site-map-frame">
			<div id="map"></div>
			<p class="site-map-status"></p>
		</div>
	</main>
	<footer class="menu-footer">
		<span class="menu-option menu-option--back-left"><a href="./index.html">back</a></span>
		<span class="menu-map--message">drag to pan &middot; scroll to zoom<br>hover a marker for my places</span>
	</footer>
	<div id="shell" data-keep>
		<div id="player" class="site-player">
			<button type="button" class="site-player-play" aria-label="Play theme">
				<img class="site-player-art" src="./assets/game/fronten1/radio_bounce.png" alt="">
				<span class="site-player-glyph">&#9654;</span>
			</button>
			<span class="site-player-bar"><span class="site-player-fill"></span></span>
		</div>
		<audio id="theme" preload="metadata" loop src="./assets/audio/theme.mp3"></audio>
	</div>
	<script src="./assets/notify/js/gtasa-notification.min.js" data-keep></script>
	<script src="./js/sky.js" data-keep></script>
	<script src="./js/cheats.js" data-keep></script>
	<script src="./js/player.js" data-keep></script>
	<script src="./js/nav.js" data-keep></script>
	<script src="./assets/menu/js/gtasamenu.min.js"></script>
	<script src="./js/map.js"></script>
	<script src="./js/site.js"></script>
</body>
</html>
